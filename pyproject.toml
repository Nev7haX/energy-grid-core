[project]
name = "energy-grid-core"
version = "0.0.0.1"
requires-python = ">=3.11,<4.0"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
